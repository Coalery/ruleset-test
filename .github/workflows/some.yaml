name: some

on:
  push:
    branches:
      - main
      - stage

jobs:
  lock-stage:
    name: Lock stage
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/branch-lock.yaml
    with:
      branch-name: stage
    secrets:
      github-token: ${{ secrets.API_PAT }}

  test-job:
    name: Test job
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm ci
      - name: Wait 3 seconds
        run: sleep 3
      - name: Semantic release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_PAT }}

  release-stage:
    name: Release stage
    if: github.ref == 'refs/heads/main' && always()
    needs:
      - lock-stage
      - test-job
    uses: ./.github/workflows/branch-unlock.yaml
    with:
      ruleset-id: ${{ needs.lock-stage.outputs.ruleset-id }}
    secrets:
      github-token: ${{ secrets.API_PAT }}
