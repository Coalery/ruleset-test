name: branch-locker

on:
  workflow_call:
    inputs:
      branch-name:
        type: string
        description: "Target branch name to lock"
        required: true
    secrets:
      github-token:
        description: "GitHub Token"
        required: true
    outputs:
      ruleset-id:
        description: "Generated ruleset ID"
        value: ${{ jobs.lock.outputs.ruleset-id }}

jobs:
  lock:
    runs-on: ubuntu-latest
    outputs:
      ruleset-id: ${{ steps.locking.outputs.RULESET_ID }}
    steps:
      - name: Lock stage branch with ruleset
        id: locking
        run: |
          response=$(curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.github-token }}" \
            https://api.github.com/repos/${{ github.repository }}/rulesets \
            -d '{"name":"브랜치가 잠겼습니다! (담당자: @${{ github.actor }})","enforcement":"active","target":"branch","bypass_actors":[{"actor_id":5,"actor_type":"RepositoryRole","bypass_mode":"always"}],"conditions":{"ref_name":{"include":["refs/heads/${{ inputs.branch-name }}"],"exclude":[]}},"rules":[{"type":"update"}]}')
          rulesetId=$(echo $response | jq -r '.id')
          echo "RULESET_ID=$rulesetId" >> $GITHUB_OUTPUT
